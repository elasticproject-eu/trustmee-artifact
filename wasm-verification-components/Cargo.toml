[workspace]
members = [
    "bootloader-verifier/bootloader-verifier-component",
    "bootloader-verifier/bootloader-verifier-test",
    "infinite-loop-verifier/infinite-loop-verifier-component",
    "kata-policy-verifier/kata-policy-core",
    "kata-policy-verifier/kata-policy-verifier-component",
    "kata-policy-verifier/kata-policy-verifier-test",
    "kata-policy-verifier/stub-hardware-verifier-component",
    "recfa-verifier/recfa-verifier-component",
    "recfa-verifier/recfa-verifier-test",
    "snp-verifier/snp-verifier-component",
    "snp-verifier/snp-verifier-test",
    "snp-verifier-host-crypto/snp-verifier-host-crypto-component",
    "snp-verifier-host-crypto/snp-verifier-host-crypto-test",
    "sgx-verifier/sgx-verifier-component",
    "sgx-verifier/sgx-verifier-test",
    "tdx-verifier/dcap-qvl-wasi",
    "tdx-verifier/tdx-verifier-component",
    "tdx-verifier/tdx-verifier-test",
    "tools/component-signer",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
assert-json-diff = "2.0.2"
base64 = "0.22.1"
byteorder = "1.5.0"
chrono = "0.4.41"
clap = { version = "4", features = ["derive"] }
ciborium = "0.2.2"
hex = "0.4.3"
log = "0.4.29"
openssl = "0.10.75"
rstest = "0.26.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
serde_with = { version = "3.16.1", features = ["base64", "hex"] }
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"], default-features = false }
tracing = "0.1.43"
wasm-encoder = "0.243"
wasmparser = "0.243"
wasmsign2 = "0.2.7"
