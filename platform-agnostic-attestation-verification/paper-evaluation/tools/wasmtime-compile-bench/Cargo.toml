[package]
name = "wasmtime-compile-bench"
version = "0.1.0"
edition = "2021"
description = "Paper-eval helper: time wasmtime::component::Component::from_binary on the verifier wasm components, with and without the on-disk compilation cache."

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "41", features = ["component-model"] }

[[bin]]
name = "wasmtime-compile-bench"
path = "src/main.rs"

[workspace]
